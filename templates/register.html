<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Register</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="bg-light">
        <div class="d-flex justify-content-center align-items-center vh-100">
            <div class="card shadow-sm w-100" style="max-width:420px">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-4">Register</h4>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                        {% endfor %}
                    {% endif %}
                    {% endwith %}
                    <form action="/register" method="POST">
                        <div class="mb-3">
                            <label class="form-label" for="name">Name:</label>
                            <input class="form-control" type="text" name="name" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email:</label>
                            <input class="form-control" type="email" name="email" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="ph_num">Phone Number:</label>
                            <input class="form-control" type="tel" name="ph_num" id="ph_num">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password:</label>
                            <input class="form-control" type="password" name="password" id="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="confirm-password">Confirm Password:</label>
                            <input class="form-control" type="password" name="confirm-password" id="confirm-password" required>
                        </div>
                        <div class="mb-3">
                            <label for="role" class="form-label">I am a </label>
                            <select class="from-select" id="role" name="role" required>
                                <option value="" disabled selected>Select Your Role</option>
                                <option value="user">User</option>
                                <option value="staff">Staff</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Register</button>
                            <a href="/" class="btn btn-outline-secondary">Back to Home</a>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </body>

</html>
