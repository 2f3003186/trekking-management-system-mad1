{% extends "/admin/treks.html" %}

{% block content%}
<h4 class="mb-4">Update Trek</h4>
<div>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}
    {% endwith %}
    <form method="POST">
        <div class="mb-3">
            <label for="name" class="form-label">Name </label>
            <input class="form-control" type="text" name="name" id="name" value="{{ trek.name}}" required>
        </div>
        <div class="mb-3">
            <label for="location" class="form-label">Location </label>
            <input class="form-control" type="text" name="location" id="location" value="{{ trek.location }}" required>
        </div>
        <div class="mb-3">
            <label for="difficulty" class="form-label">Difficulty </label>
            <select class="form-select" name="difficulty" id="difficulty" required>
                <option value="easy" {% if trek.difficulty == "easy" %} selected {% endif %}>Easy</option>
                <option value="moderate" {% if trek.difficulty == "moderate" %} selected {% endif %}>Moderate</option>
                <option value="challenging" {% if trek.difficulty == "challenging" %} selected {% endif %}>Challenging</option>
            </select> 
        </div>
        <div class="mb-3">
            <label for="duration" class="form-label">Duration(days) </label>
            <input class="form-control" type="number" name="duration" id="duration" value="{{ trek.duration }}" required>
        </div>
        <div class="mb-3">
            <label for="slots" class="form-label">Available Slots </label>
            <input class="form-control" type="number" name="slots" id="slots" required value="{{ trek.available_slots }}">
        </div>
        <div class="mb-3">
            <label for="status" class="form-label">Status </label>
            <select class="form-select" type="text" name="status" id="status" required>
                <option value="open" {% if trek.status == "open" %} selected {% endif %}>Open</option>
                <option value="closed" {% if trek.status == "closed" %} selected {% endif %}>Closed</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="start_date" class="form-label">Start Date </label>
            <input class="form-control" type="date" name="start_date" id="start_date" required value="{{ trek.start_date }}">
        </div>
        <div class="mb-3">
            <label for="end_date" class="form-label">End Date </label>
            <input class="form-control" type="date" name="end_date" id="end_date" required value="{{ trek.end_date }}">
        </div>
        <div class="mb-3">
            <label for="staff" class="form-label">Staff </label>
            <select class="form-select" name="staff" id="staff" multiple size="4">
                <option value="" disabled selected>Assign Staff</option>
                {% for staff_member in staff %}
                <option value="{{staff_member.id}}" {% if staff_member.id in [assignment.staff_id for assignment in trek.assigned_staff]  %} selected {% endif %}>{{staff_member.name}}</option>
                {% endfor %}
            </select>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Update Trek</button>
            <a href="/admin/treks" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
