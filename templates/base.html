<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %} Trekking Management {% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body class="bg-light">
        <div class="d-flex">
            <div class="bg-white border-end vh-100" style="width:220px; position:sticky; top:0;">
                <h5 class="m-3">Trekking App</h5>
                <ul class="nav nav-pills flex-column gap-1">
                    {% block sidebar%}
                    {% endblock %}
                <li class="nav-item mt-3">
                    <a class="nav-link text-danger" href="/login.html">Logout</a>
                </li>
                </ul>
            </div>
            <div class="flex-grow-1">
                <div class="bg-white border-bottom px-4 py-2 d-flex justify-content-end align-items-center">
                    <span class="text-muted"> {{current_user_name}} &middot; {{current_role}}</span>
                </div>
                <div class="p-4">
                    {% block content %} {% endblock %}
                </div>
            </div>
        </div>
    </body>
</html>
